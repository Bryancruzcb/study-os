server:
  # a host that assigns the port says so in PORT; locally it stays 8080
  port: ${PORT:8080}
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/studyos
    username: studyos
    password: studyos
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 33MB
app:
  # empty locally. On a public host APP_ACCESS_CODE is set and every /api call must send it
  access-code: ${APP_ACCESS_CODE:}
  study:
    # a bulk import fills the calendar forward at this many new concepts a day per course
    new-concepts-per-day: 8
    # before an exam, the part of the days left that is kept for review after the last new topic
    exam-review-share: 0.2
  model:
    generation: claude-opus-5
    grading: claude-opus-5
